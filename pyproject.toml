[project]
name = "pacman"
version = "0.1.0"
description = "Pac-Man recreated with pygame"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "pygame",
    "mazegenerator",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
    "pytest",
    "pyinstaller",
]

[tool.uv]
package = false

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }
